<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Fishing Together</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #1b2430; overflow: hidden; overscroll-behavior: none; }
      #game { width: 100%; height: 100%; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
      #lobby { position: fixed; inset: 0; display: flex; align-items: safe center; justify-content: center; overflow-y: auto;
        font: 16px/1.4 monospace; color: #fff; }
      #lobby[hidden] { display: none; }
      #lobby .panel { background: #26344a; border: 3px solid #4a6a96; padding: 24px 32px; width: 340px; max-width: calc(100vw - 24px); box-sizing: border-box; }
      @media (max-height: 480px) { #lobby .panel { padding: 10px 16px; } #lobby h1 { font-size: 18px; margin-bottom: 6px; } #lobby label { margin-bottom: 4px; } #lobby button { margin-top: 6px; padding: 8px; } }
      #lobby h1 { margin: 0 0 12px; font-size: 22px; text-align: center; color: #7fd1ff; }
      #lobby label { display: block; margin-bottom: 10px; }
      #lobby input { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 8px;
        font: inherit; background: #101826; color: #fff; border: 2px solid #4a6a96; }
      #lobby input.code { text-transform: uppercase; letter-spacing: 4px; text-align: center; margin: 0; }
      #lobby button { width: 100%; padding: 10px; margin-top: 10px; font: inherit; cursor: pointer;
        background: #3a7bd5; color: #fff; border: 0; border-bottom: 3px solid #1e4f94; }
      #lobby button.secondary { background: #3b4a62; border-color: #232d3d; }
      #lobby button:disabled { opacity: .5; cursor: not-allowed; }
      #lobby .row { display: flex; gap: 8px; margin-top: 10px; }
      #lobby .row button { width: 90px; margin: 0; }
      #lobby ul { list-style: none; padding: 0; margin: 12px 0; }
      #lobby li { display: flex; justify-content: space-between; padding: 6px 8px; background: #101826; margin-bottom: 4px; }
      #lobby li.me { border-left: 3px solid #7fd1ff; }
      #lobby .ok { color: #7be08a; } #lobby .muted { color: #8fa3bf; } #lobby .error { color: #ff8a8a; min-height: 1em; }

      #shop { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: 14px/1.4 monospace; color: #fff;
        background: rgba(5, 12, 24, .55); }
      #shop[hidden] { display: none; }
      #shop .panel { background: #26344a; border: 3px solid #4a6a96; width: min(560px, 94vw); max-height: 88vh; display: flex; flex-direction: column; padding: 14px 18px; }
      #shop header { display: flex; justify-content: space-between; align-items: baseline; }
      #shop header { gap: 10px; align-items: center; }
      #shop header h2 { flex: 1; }
      #shop button.x { padding: 4px 12px; font-size: 20px; line-height: 1.2; background: #7a2530; border-color: #4d1620; }
      #shop nav { flex-wrap: wrap; }
      @media (max-height: 480px) { #shop .panel { max-height: 98vh; padding: 8px 12px; } #shop nav { margin: 6px 0; } #shop .list { max-height: 30vh; } #shop button { padding: 6px 10px; } }
      #shop h2 { margin: 0; color: #7fd1ff; font-size: 20px; }
      #shop h3 { margin: 12px 0 4px; font-size: 13px; color: #8fa3bf; text-transform: uppercase; }
      #shop .wallet { color: #ffe14d; font-size: 16px; }
      #shop nav { display: flex; gap: 6px; margin: 10px 0; }
      #shop button { font: inherit; cursor: pointer; padding: 7px 12px; color: #fff; border: 0; border-bottom: 3px solid #232d3d; background: #3b4a62; }
      #shop button.tab.on { background: #3a7bd5; border-color: #1e4f94; }
      #shop button.tab.close { margin-left: auto; }
      #shop button.primary { background: #2f9e57; border-color: #1b6b3a; }
      #shop button:disabled { opacity: .45; cursor: not-allowed; }
      #shop section { overflow-y: auto; min-height: 120px; }
      #shop .list { display: flex; flex-direction: column; gap: 3px; max-height: 38vh; overflow-y: auto; }
      #shop .row { display: flex; align-items: center; gap: 10px; padding: 3px 8px; background: #101826; cursor: pointer; border-left: 3px solid transparent; }
      #shop .row.sel { border-left-color: #ffe14d; background: #1b2a44; }
      #shop .row .name { flex: 1; } #shop .row small { margin-left: 4px; }
      #shop .row .weight { color: #8fa3bf; } #shop .row .price { color: #ffe14d; min-width: 52px; text-align: right; }
      #shop canvas.icon { width: 32px; height: 32px; image-rendering: pixelated; }
      #shop .actions { display: flex; gap: 8px; margin-top: 10px; }
      #shop .cards { display: flex; gap: 8px; flex-wrap: wrap; }
      #shop .card { flex: 1 1 150px; display: flex; flex-direction: column; gap: 3px; padding: 8px; background: #101826; border: 2px solid #26344a; }
      #shop .card.on { border-color: #ffe14d; }
      #shop .card small { color: #8fa3bf; min-height: 2.6em; } #shop .card button { margin-top: 4px; }
      #toast { position: fixed; left: 12px; bottom: 12px; max-width: 320px; padding: 8px 12px; font: 13px/1.4 monospace; color: #fff;
        background: #7a2530; border: 2px solid #c44b5a; z-index: 50; }
      #toast[hidden] { display: none; }
      #shop .dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-top: 8px; }
      #shop .dexcard { align-items: center; text-align: center; flex: none; }
      #shop .dexcard canvas.icon { width: 48px; height: 48px; }
      #shop canvas.icon.locked { filter: brightness(0); opacity: .55; }
      #shop .dexcard.locked b { color: #6b7a90; }
      #lobby button.link { background: none; border: 0; color: #8fa3bf; text-decoration: underline; margin-top: 12px; padding: 0; width: auto; }
      #lobby .credits { margin-top: 8px; font-size: 12px; color: #8fa3bf; } #lobby .credits p { margin: 3px 0; }
      #shop .muted { color: #8fa3bf; } #shop .msg { margin: 10px 0 0; min-height: 1.4em; color: #cfe6ff; }
      #chat { position: fixed; left: 10px; bottom: 10px; width: min(420px, 60vw); font: 14px/1.35 sans-serif; color: #fff; z-index: 5; }
      #chat .log { max-height: 9.5em; overflow-y: auto; text-shadow: 0 0 3px #000, 0 0 3px #000; pointer-events: none; }
      #chat .log div { background: rgba(0, 0, 0, .55); padding: 1px 6px; margin-top: 1px; width: fit-content; max-width: 100%; overflow-wrap: anywhere; }
      #chat.open .log { pointer-events: auto; max-height: 13em; background: rgba(5, 12, 24, .8); }
      #chat .hint { margin-top: 4px; font-size: 12px; color: #cfe6ff; opacity: .7; text-shadow: 0 0 3px #000; }
      #chat .form { background: rgba(5, 12, 24, .92); border: 2px solid #4a6a96; padding: 6px; margin-top: 4px; }
      #chat .buttons { display: flex; gap: 6px; margin-top: 6px; }
      #chat .buttons button { flex: 1; font: inherit; font-size: 14px; padding: 7px 8px; background: #3a7bd5; color: #fff; border: 0; border-bottom: 3px solid #1e4f94; cursor: pointer; }
      #chat .buttons button.secondary { background: #3b4a62; border-color: #232d3d; }
      #chat .quick { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
      #chat .quick button { font: inherit; font-size: 13px; padding: 3px 8px; background: #26344a; color: #fff; border: 1px solid #4a6a96; cursor: pointer; }
      #chat .quick button:hover { background: #35507a; }
      #chat input { box-sizing: border-box; width: 100%; font: inherit; font-size: 15px; padding: 5px 8px; background: #101826; color: #fff; border: 1px solid #4a6a96; }
      #chat small { color: #8fa3bf; } #chat small.err { color: #ff8a8a; margin-left: 8px; }
      #shop .friendbar { height: 10px; background: #101826; border: 1px solid #4a6a96; } #shop .friendbar i { display: block; height: 100%; background: #7be08a; }
      #shop .titles .row, #shop .memories .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 8px; background: #101826; margin-bottom: 3px; }
      #shop .title:not(.earned) { color: #6c7a90; } #shop .title.earned .name { color: #ffe14d; } #shop .titles small { color: #8fa3bf; font-weight: normal; }
      #photo { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(5, 12, 24, .7); z-index: 20; font: 14px/1.4 sans-serif; }
      #photo[hidden] { display: none; }
      #photo .polaroid { background: #fffdf5; color: #222; padding: 14px 14px 12px; width: min(620px, 92vw); box-shadow: 0 8px 30px rgba(0,0,0,.6); transform: rotate(-1.2deg); }
      #photo img { width: 100%; image-rendering: pixelated; display: block; background: #000; }
      #photo .caption { margin: 10px 0 2px; font-size: 20px; font-weight: bold; text-align: center; } #photo small { display: block; text-align: center; color: #666; }
      #photo .bar { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
      #photo .bar a, #photo .bar button { font: inherit; padding: 6px 14px; background: #26344a; color: #fff; border: 0; cursor: pointer; text-decoration: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="lobby"></div>
    <div id="shop" hidden></div>
    <div id="toast" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
